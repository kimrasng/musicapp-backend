services:
  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-musicapp}
      MYSQL_USER: ${MYSQL_USER:-musicapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-musicapp}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${MYSQL_USER:-musicapp}",
          "-p${MYSQL_PASSWORD:-musicapp}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: .
    environment:
      MYSQL_DSN: ${MYSQL_USER:-musicapp}:${MYSQL_PASSWORD:-musicapp}@tcp(mysql:3306)/${MYSQL_DATABASE:-musicapp}?parseTime=true
      PORT: ${PORT:-8080}

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: